# 3-class artery/vein/background adaptation of vesselFM
experiment: av_ct
seed: 42

data:
  train_images: /projectnb/ec500kb/projects/Fall_2025_Projects/Project_4_VesselFM/VesselFMAdaptationMethod/vesselFM-main/vesselFM-main/data/imagesTr_pre
  train_labels: /projectnb/ec500kb/projects/Fall_2025_Projects/Project_4_VesselFM/VesselFMAdaptationMethod/vesselFM-main/vesselFM-main/data/labelsTr_pre
  val_images:   /projectnb/ec500kb/projects/Fall_2025_Projects/Project_4_VesselFM/VesselFMAdaptationMethod/vesselFM-main/vesselFM-main/data/imagesVal_pre
  val_labels:   /projectnb/ec500kb/projects/Fall_2025_Projects/Project_4_VesselFM/VesselFMAdaptationMethod/vesselFM-main/vesselFM-main/data/labelsVal_pre
  preprocessed: true
  spacing: null # [1.0, 1.0, 1.0]
  clip_hu: null # [-1000, 600]
  zscore: false # True if not preprocessing
  patch_size: [128, 128, 128]
  samples_per_volume: 8           # Was set to 4
  min_fg_fraction: 0.02            # hard-example mining, set back to default of 0.02 after testing
  artery_patch_prob: 0.5
  min_artery_fraction: 0.005
  labels:
    background: 0
    artery: 1
    vein: 2

model:
  num_classes: 3
  dropout: 0.1 # Was 0.2
  pretrain_ckpt: /projectnb/ec500kb/projects/Fall_2025_Projects/Project_4_VesselFM/VesselFMAdaptationMethod/vesselFM-main/vesselFM-main/checkpoints/vesselfm_finetuned_monai.pt

loss:
  dice_ce_weight: 1.0
  class_weights: [0.03, 0.52, 0.45]   # Previous calculated weights: [0.00825826, 0.52217536, 0.46956638]   # Previous [0.05, 0.475, 0.475]
  use_soft_cldice: true
  soft_cldice_weight_stage1: 0.2 # Was 0.3, default was 0.2
  soft_cldice_weight_stage2: 0.5 # Was 0.6
  soft_cldice_iters: 2
  # Extra A/V-specific loss (second head)
  av_head_weight: 1.5               # Scales A/V loss term; 0.5–1.0
  av_class_weights: [0.6, 0.4]      # Artery, vein weights inside A/V loss
  # Per-class clDice weights
  soft_cldice_weight_art: 0.05
  soft_cldice_weight_vein: 0.05
  vessel_consistency_weight: 0.1

optim:
  lr_stage1: 3.0e-4 # Was 3.0e-4
  lr_stage2: 3.0e-5 # Was 3.0e-5
  weight_decay: 5.0e-6 # Was 1.0e-5
  val_cldice_workers: 8 
  epochs_stage1: 100
  epochs_stage2: 30
  batch_size: 3
  amp: true

augment:
  gamma: [0.8, 1.2] # Was [0.7, 1.5]
  noise_std: 0.01
  flip_prob: 0.5
  elastic_prob: 0.0 # Turn off while tuning

inference:
  tta: false
  sigmoid_threshold: 0.5
  keep_small_cc_voxels: 50
