# Stage 1: vessel vs background pretraining (union A∪V)

experiment: vessel_ct
seed: 42

data:
  train_images: /projectnb/ec500kb/projects/Fall_2025_Projects/Project_4_VesselFM/VesselFMAdaptationMethod/vesselFM-main/vesselFM-main/data/imagesTr_pre2
  train_labels: /projectnb/ec500kb/projects/Fall_2025_Projects/Project_4_VesselFM/VesselFMAdaptationMethod/vesselFM-main/vesselFM-main/data/labelsTr_pre2
  val_images:   /projectnb/ec500kb/projects/Fall_2025_Projects/Project_4_VesselFM/VesselFMAdaptationMethod/vesselFM-main/vesselFM-main/data/imagesVal_pre2
  val_labels:   /projectnb/ec500kb/projects/Fall_2025_Projects/Project_4_VesselFM/VesselFMAdaptationMethod/vesselFM-main/vesselFM-main/data/labelsVal_pre2
  preprocessed: true
  patch_size: [96, 96, 96]
  samples_per_volume: 8
  min_fg_fraction: 0.02
  artery_patch_prob: 0.5
  min_artery_fraction: 0.005
  mixed_av_patch_prob: 0.3
  num_workers: 16

model:
  num_classes: 3        # Keep 3-class head, use vessel_head on top
  dropout: 0.1
  pretrain_ckpt: /projectnb/ec500kb/projects/Fall_2025_Projects/Project_4_VesselFM/VesselFMAdaptationMethod/vesselFM-main/vesselFM-main/checkpoints/vesselFM_base.pt

loss:
  # Relative weights for BCE vs clDice on vessel_head
  vessel_bce_weight: 0.5
  vessel_cldice_weight: 1.0
  soft_cldice_iters: 2

optim:
  lr: 3.0e-4
  weight_decay: 5.0e-6
  val_cldice_workers: 16
  epochs: 80
  batch_size: 2
  amp: true

augment:
  flip_prob: 0.5
  rotate_prob: 0.3
  zoom_prob: 0.3
  noise_std: 0.01